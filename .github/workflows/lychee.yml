name: Link Checker

on:
  push:

# 避免并发运行互相覆盖缓存
concurrency:
  group: lychee-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linkChecker:
    name: Lychee link checker
    runs-on: ubuntu-latest
    steps:
      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          format: markdown
          output: lychee/out.md
          # 排除掉只在本地存在的资源
          # README 中 tags 引用在 Linux 下有奇怪的表现
          # 额外允许在云端无法访问的资源
          # 排除一些云端超时的
          args: >-
            --base-url ${{ github.workspace }}
            --exclude "Vault/"
            --exclude "wikidevi.wi-cat.ru"
            --exclude "backreference.org"
            --exclude-path './README.md'
            --accept "200..=403, 418..=500"
            --verbose
            .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: lychee/out.md
          if-no-files-found: ignore
