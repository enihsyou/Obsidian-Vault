# lychee.toml — configuration for the lychee link checker
# Reference: https://lychee.cli.rs/guides/config/
#
# CLI flags and the workflow's `args:` override values in this file.

#############################  Cache  ###############################
cache = true
max_cache_age = "1d"

#############################  Display  #############################
no_progress = true
verbose = "info"

#############################  Requests  ############################
# Connect-to-response timeout, in seconds.
timeout = 10

#############################  Inputs  ###############################
# Only scan Markdown files; the vault ships no other link-bearing types.
extensions = ["md"]
# Don't treat mailto: links as targets (they have no HTTP status).
include_mail = false

include_wikilinks = true
fallback_extensions = ["md"]

#############################  Exclusions  ##########################
# Drop loopback / private / link-local addresses out of the box.
exclude_loopback = true
exclude_private = true
exclude_link_local = true

# Sites known to block headless link checkers (Cloudflare bot challenges,
# aggressive rate limiting, anti-bot walls, etc.). Match by domain only.
exclude = [
    # Stack Exchange network
    "//stackoverflow\\.com",
    "//superuser\\.com",
    "//serverfault\\.com",
    "//askubuntu\\.com",
    "//mathoverflow\\.net",
    "//stackapps\\.com",
    "//stackexchange\\.com",

    # Social platforms with aggressive bot / rate-limit blocking
    "//twitter\\.com",
    "//x\\.com",
    "//t\\.me",
    "//weibo\\.com",
    "//weibo\\.cn",

    # Chinese platforms with anti-bot protections
    "//zhihu\\.com",
    "//bilibili\\.com",
    "//douban\\.com",
    "//csdn\\.net",
    "//jianshu\\.com",
    "//juejin\\.cn",

    # App / extension stores that block headless clients
    "//apps\\.apple\\.com",
    "//play\\.google\\.com",
    "//microsoft\\.com",
]
